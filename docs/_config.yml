gh_edit_repository: "https://github.com/info-moed/Lumora"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"
footer_content: "Lumora is open source under the <a href=\"https://github.com/info-moed/Lumora/blob/main/LICENSE\">MIT license</a>."

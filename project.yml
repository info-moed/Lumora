# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Lumora
options:
  bundleIdPrefix: io.github.info-moed
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 6 compiler, Swift 5 language mode (relaxed concurrency checking)
    ARCHS: arm64                    # Apple silicon only (macOS 27 is the last release with Intel compatibility tooling)
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_OBJC_BRIDGING_HEADER: Lumora/Shaders/Lumora-Bridging-Header.h
    MTL_HEADER_SEARCH_PATHS: $(SRCROOT)/Lumora/Shaders
    MTL_FAST_MATH: YES
    SWIFT_OPTIMIZATION_LEVEL: -O
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: Lumora/Lumora.entitlements
  configs:
    # Debug hosts the unit tests, a separately signed bundle that a hardened runtime with library validation
    # would refuse to load. Release (what ships and gets notarized) keeps the hardened runtime, no exemptions.
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
targets:
  Lumora:
    type: application
    platform: macOS
    sources:
      - path: Lumora
        excludes:
          - "Resources/**"
      - path: Lumora/Resources
        buildPhase: resources
    info:
      path: Lumora/Info.plist
      properties:
        CFBundleDisplayName: Lumora
        CFBundleShortVersionString: "0.11.1"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "27.0"
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: "© 2026 info-moed. MIT license."
        # Finder's Open With lists Lumora for these; they open in the built-in Player. Rank Alternate leaves the
        # default player alone.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.mpeg-4
              - com.apple.quicktime-movie
              - public.mpeg-2-transport-stream
              - org.matroska.mkv
              - org.webmproject.webm
              - io.github.info-moed.lumora.obu
              - io.github.info-moed.lumora.ivf
              - io.github.info-moed.lumora.vvc
              - io.github.info-moed.lumora.y4m
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification: { public.filename-extension: [mkv] }
          - UTTypeIdentifier: org.webmproject.webm
            UTTypeDescription: WebM video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification: { public.filename-extension: [webm] }
          - UTTypeIdentifier: io.github.info-moed.lumora.obu
            UTTypeDescription: AV1 / AV2 OBU stream
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification: { public.filename-extension: [obu] }
          - UTTypeIdentifier: io.github.info-moed.lumora.ivf
            UTTypeDescription: IVF video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification: { public.filename-extension: [ivf] }
          - UTTypeIdentifier: io.github.info-moed.lumora.vvc
            UTTypeDescription: H.266 / VVC stream
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification: { public.filename-extension: ["266", vvc, h266] }
          - UTTypeIdentifier: io.github.info-moed.lumora.y4m
            UTTypeDescription: YUV4MPEG2 video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification: { public.filename-extension: [y4m] }
    postBuildScripts:
      - name: Bundle helper tools (optional)
        script: '"$SRCROOT/scripts/bundle-tools.sh" || true'
  LumoraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LumoraTests
    dependencies:
      - target: Lumora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lumora.app/Contents/MacOS/Lumora
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Lumora:
    build:
      targets:
        Lumora: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LumoraTests

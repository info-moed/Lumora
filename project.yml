# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Lumora
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"            # Swift 6 compiler, Swift 5 language mode (relaxed concurrency checking)
    ARCHS: arm64                    # Apple silicon only (macOS 27 is the last release with Intel compatibility tooling)
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_OBJC_BRIDGING_HEADER: Lumora/Shaders/Lumora-Bridging-Header.h
    MTL_HEADER_SEARCH_PATHS: $(SRCROOT)/Lumora/Shaders
    MTL_FAST_MATH: YES
    SWIFT_OPTIMIZATION_LEVEL: -O
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: Lumora/Lumora.entitlements
targets:
  Lumora:
    type: application
    platform: macOS
    sources:
      - path: Lumora
        excludes:
          - "Resources/**"
      - path: Lumora/Resources
        buildPhase: resources
    info:
      path: Lumora/Info.plist
      properties:
        CFBundleDisplayName: Lumora
        LSMinimumSystemVersion: "27.0"
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: "© Your Company"
    postBuildScripts:
      - name: Bundle helper tools (optional)
        script: '"$SRCROOT/scripts/bundle-tools.sh" || true'
  LumoraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LumoraTests
    dependencies:
      - target: Lumora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Lumora.app/Contents/MacOS/Lumora
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Lumora:
    build:
      targets:
        Lumora: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LumoraTests
